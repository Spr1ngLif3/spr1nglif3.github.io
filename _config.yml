title: Spr1ngLif3
description: "An hacker's basement"
url: "https://spr1nglif3.github.io"
baseurl: ""
lang: en
timezone: Europe/Rome

author:
  name: Spr1ngLif3

remote_theme: Spr1ngLif3/jekyll-theme-neuromancer@v0.3.1

plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

permalink: /:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
    values:
      layout: page

neuromancer:
  accent: violet
  prompt_host: Spr1ngLif3

  avatar: /assets/images/Avatar.jpg
  avatar_alt: Spr1ngLif3_avatar
  home_posts: 5
  terminal:
    - command: whoami
      output: Pasquale Macchia
    - command: cat motd
      output: The best use one can make of power is to give it up

  nav:
    - title: blog
      url: /blog/
    - title: tags
      url: /tags/
    - title: about
      url: /about/

  social:
    - name: github
      url: https://github.com/Spr1ngLif3
    - name: linkedin
      url: https://linkedin.com/in/pasquale-macchia-837450446
    - name: hackthebox
      url: https://profile.hackthebox.com/profile/01a0764f-58c6-7129-85e0-f023b96f0ebc
    - name: tryhackme
      url: https://tryhackme.com/p/Spr1ngLif3
